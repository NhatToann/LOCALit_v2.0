# coturn TURN server configuration for LOCALit voice calls.
#
# Copy this file to /etc/turnserver.conf on the host running coturn
# (Debian/Ubuntu: `apt install coturn` then place this file). For local
# development, prefer docker-compose.yml which mounts these flags inline.
#
# The values <PLACEHOLDER> below must be replaced at deploy time:
#   - realm       : the public DNS name clients see (e.g. turn.localit.dev).
#                   MUST match the realm claim in the HMAC username issued
#                   by /api/webrtc/turn so coturn's user-check accepts it.
#   - static-auth-secret : the long-lived shared secret used by both
#                   /api/webrtc/turn (to derive short-lived passwords via
#                   HMAC-SHA1) and coturn (to verify them).
#                   Generate with: openssl rand -hex 32
#
# See docs/coturn-setup.md for full Fly.io / VPS deploy steps.

realm=turn.locality.example

# Listening ports
listening-port=3478
tls-listening-port=5349
alt-listening-port=3478
alt-tls-listening-port=5349

# Relay allocation pool (UDP/TCP media)
min-port=49160
max-port=49200

# HMAC-SHA1 short-lived auth (Twilio-style). The Next.js route
# /api/webrtc/turn issues username = "<unix-expiry>:userid" and
# password = base64(hmac-sha1(secret, username)). coturn verifies with
# these flags without ever needing a per-user DB row.
use-auth-secret
static-auth-secret=<PLACEHOLDER_SHARED_SECRET>

# Fingerprints required for WebRTC (ICE/DTLS-SRTP).
fingerprint

# Server-name appears in logs / stats
server-name=localit-turn

# Disable stuff we don't need
no-cli
no-multicast-peers
no-loopback-peers
no-rfc5780
no-stun-backward-compatibility
response-origin-only-with-rfc5780

# Fingerprint-on-all for safer DTLS
# (Keep commented in dev unless you want chatty logs.)
# verbose

# To enable turns:// (TLS) in production, point these to a Let's Encrypt
# cert + key for the realm:
# cert=/etc/coturn/certs/turn.localit.dev.fullchain.pem
# pkey=/etc/coturn/certs/turn.localit.dev.key
# no-tls=false
# no-dtls=false